# Failsafe policy.
# Action values: 0 = warn only, 1 = hold, 2 = return to launch, 3 = land,
#                4 = terminate (never enable without a hardware kill path).

BATTERY_LOW_ACTION       2
BATTERY_CRIT_ACTION      3
RC_LOSS_ACTION           2
GCS_LOSS_ACTION          1
GNSS_LOSS_ACTION         1
MISSION_ABORT_ACTION     2
GEOFENCE_ACTION          2

# Timeouts and thresholds.
BATTERY_LOW_THR          0.20
BATTERY_CRIT_THR         0.10
RC_LOSS_TIMEOUT_MS       1000
GCS_LOSS_TIMEOUT_MS      5000
GNSS_LOSS_TIMEOUT_MS     5000
MISSION_ABORT_TIMEOUT_MS 2000

# Behaviour details.
RTL_AFTER_GCS_LOSS       1
LAND_AFTER_BATTERY_CRIT  1
ALLOW_MANUAL_OVERRIDE    1
