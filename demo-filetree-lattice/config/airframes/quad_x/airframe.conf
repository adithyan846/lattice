# Quad-X airframe for freertrtos.
# Motor order matches src/modules/control_allocator/mixer_quad_x.h:
#   0 front-right (CCW)
#   1 rear-left   (CCW)
#   2 front-left  (CW)
#   3 rear-right  (CW)

AIRFRAME_TYPE      quad_x
MOTOR_COUNT        4
MOTOR_1_POSITION   front_right
MOTOR_2_POSITION   rear_left
MOTOR_3_POSITION   front_left
MOTOR_4_POSITION   rear_right
MOTOR_1_DIRECTION  ccw
MOTOR_2_DIRECTION  ccw
MOTOR_3_DIRECTION  cw
MOTOR_4_DIRECTION  cw

# Geometry and limits. Measure the real arm length before flight.
MIXER_ARM_LENGTH_M 0.25
MIXER_TORQUE_GAIN  2.0
MIXER_MOTOR_MIN    0.0
MIXER_MOTOR_MAX    1.0
MIXER_SLEW_RATE    0.0
