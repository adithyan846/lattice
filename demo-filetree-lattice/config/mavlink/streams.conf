# MAVLink outgoing stream rates.
# Format: MESSAGE_NAME RATE_HZ
# 0 disables a stream. Rates are converted to intervals by mavlink_streams.c.

HEARTBEAT             1
SYS_STATUS            2
SYSTEM_TIME           1
GPS_RAW_INT           5
GLOBAL_POSITION_INT   5
LOCAL_POSITION_NED    10
ATTITUDE              10
BATTERY_STATUS        1
MISSION_CURRENT       2
STATUSTEXT            0
